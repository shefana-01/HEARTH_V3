# Scale the busiest stateless parts on CPU, and keep at least one pod of each during node maintenance.
# Needs metrics-server in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: hearth
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: decision-service
  namespace: hearth
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: decision-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-service
  namespace: hearth
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: task-service }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hearth-services
  namespace: hearth
spec:
  minAvailable: 1
  selector:
    matchLabels: { part-of: hearth }
