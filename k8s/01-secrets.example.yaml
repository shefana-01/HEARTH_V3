# Copy to 01-secrets.yaml, fill in real values and apply it (never commit the filled-in file), or create the
# secret from your secret manager with these keys:
#   kubectl -n hearth create secret generic hearth-secrets --from-literal=DB_PASSWORD=... ...
apiVersion: v1
kind: Secret
metadata:
  name: hearth-secrets
  namespace: hearth
type: Opaque
stringData:
  DB_PASSWORD: change-me
  POSTGRES_PASSWORD: change-me          # the same as DB_PASSWORD
  NEO4J_PASSWORD: change-me-too
  NEO4J_AUTH: neo4j/change-me-too       # "neo4j/" + NEO4J_PASSWORD
  # node tools/vapid-keys.mjs
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  # Optional: AI help. Empty keeps it off.
  AI_API_KEY: ""
