apiVersion: apps/v1
kind: Deployment
metadata:
  name: care-service
  namespace: hearth
  labels: { app: care-service, part-of: hearth }
spec:
  replicas: 1
  # One pod owns the document volume (ReadWriteOnce): replace it rather than run two side by side.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: care-service }
  template:
    metadata:
      labels: { app: care-service, part-of: hearth }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 101 }
      terminationGracePeriodSeconds: 40
      containers:
        - name: care-service
          image: hearth/care-service:latest
          ports: [{ containerPort: 8084, name: http }]
          envFrom:
            - configMapRef: { name: hearth-config }
          env:
            - { name: DB_NAME, value: hearth_care }
            - { name: PORT, value: "8084" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: hearth-secrets, key: DB_PASSWORD } }
            - name: NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: hearth-secrets, key: NEO4J_PASSWORD } }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k" }
            - { name: STORAGE_DIR, value: /data/documents }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: documents, mountPath: /data }
      volumes:
        - name: documents
          persistentVolumeClaim: { claimName: care-documents }
---
apiVersion: v1
kind: Service
metadata:
  name: care-service
  namespace: hearth
spec:
  selector: { app: care-service }
  ports: [{ port: 8084, targetPort: http, name: http }]
---
