# The seven Hearth services. Each reads its database name from DB_NAME and everything else from
# hearth-config / hearth-secrets. Probes use Spring Boot's liveness and readiness groups; Prometheus scrapes
# /actuator/prometheus (see the annotations).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-service
  namespace: hearth
  labels: { app: family-service, part-of: hearth }
spec:
  replicas: 2
  selector:
    matchLabels: { app: family-service }
  template:
    metadata:
      labels: { app: family-service, part-of: hearth }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 101 }
      terminationGracePeriodSeconds: 40
      containers:
        - name: family-service
          image: hearth/family-service:latest
          ports: [{ containerPort: 8081, name: http }]
          envFrom:
            - configMapRef: { name: hearth-config }
          env:
            - { name: DB_NAME, value: hearth_family }
            - { name: PORT, value: "8081" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: hearth-secrets, key: DB_PASSWORD } }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: family-service
  namespace: hearth
spec:
  selector: { app: family-service }
  ports: [{ port: 8081, targetPort: http, name: http }]
---
