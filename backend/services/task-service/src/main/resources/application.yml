server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hearth_task}
    username: ${DB_USER:hearth}
    password: ${DB_PASSWORD:hearth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      group-id: task-service
      auto-offset-reset: earliest
    listener:
      # Start even when Kafka is not up yet; the consumer connects when it is.
      missing-topics-fatal: false

management:
  metrics:
    tags:
      # Every metric says which service it came from (Prometheus also adds the instance).
      application: ${spring.application.name}
    distribution:
      # Latency histograms, so Prometheus can compute percentiles across instances (Grafana "95th percentile").
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

hearth:
  # Where people open Hearth; used for links inside calendar events.
  app-url: ${APP_URL:http://localhost:8000}
  security:
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:hearth}
    # Calendar apps fetch the private calendar address without signing in; the token in it is the secret.
    public-paths: /api/v1/calendar/feeds/**
  outbox:
    enabled: true
  consumer:
    enabled: ${KAFKA_CONSUMERS:true}
  reminders:
    # How often to look for tasks that start within 15 minutes.
    poll-ms: 60000
  services:
    family: ${FAMILY_SERVICE_URL:http://localhost:8081}
