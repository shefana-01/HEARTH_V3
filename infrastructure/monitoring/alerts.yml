# Alert rules, shown on Prometheus's Alerts page (http://localhost:9090/alerts) and in Grafana.
# See docs/operations/RUNBOOK.md for what to do about each one.
groups:
  - name: hearth
    rules:
      - alert: ServiceDown
        expr: up{job="hearth"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is not answering"
      - alert: HighErrorRate
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of {{ $labels.application }} requests fail"
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket{application!="api-gateway", uri!~"/actuator.*|/api/v1/notifications/stream"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile latency of {{ $labels.application }} is above 1 s (services only; live-update streams are left out because they stay open by design)"
      - alert: OutboxBacklog
        expr: hearth_outbox_pending > 100
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.application }} has {{ $value }} events waiting for Kafka"
      - alert: EventsDeadLettered
        expr: increase(hearth_events_dead_lettered_total[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} parked events on {{ $labels.topic }}.DLT"
      - alert: ConsumerLag
        expr: max by (application) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} is more than 1000 events behind"
      - alert: JvmMemoryHigh
        expr: sum by (application) (jvm_memory_used_bytes{area="heap"}) / sum by (application) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} uses more than 90% of its heap"
