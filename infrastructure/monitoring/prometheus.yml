# Prometheus scrapes every Hearth service's /actuator/prometheus on the internal network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hearth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - family-service:8081
          - task-service:8082
          - decision-service:8083
          - care-service:8084
          - notification-service:8085
          - audit-service:8086
          - ai-service:8087
