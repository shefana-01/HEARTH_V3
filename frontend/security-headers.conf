# Security headers for every response. Included in each location that sets its own headers, because nginx
# does not inherit add_header into a location that has add_header of its own.
#
# The script hash allows exactly the small inline script in index.html that applies the saved theme before
# the first paint. If that script changes, update the hash (src/test/csp.test.ts fails until you do).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-kSq/isJiCrnqXP781eiikdnLUNiVzShZaaMQkHL5CZc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# Voice typing needs the microphone on Hearth's own pages; nothing else may use the camera or location.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
