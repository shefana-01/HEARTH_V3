# Serves the built web app and forwards API calls to the gateway (see frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Document uploads are up to 20 MB.
    client_max_body_size 21m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Live updates (server-sent events): pass each message on as it comes, and keep the stream open.
    location = /api/v1/notifications/stream {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        # The full host with its port, so the gateway sees a call from this page as same-origin (not CORS).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the app (React Router handles it).
    # The service worker must always be checked for a new version.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
