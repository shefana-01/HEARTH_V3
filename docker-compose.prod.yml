# Production: the same services as docker-compose.yml, behind Caddy with automatic HTTPS.
#
#   cp .env.example .env      # then fill in the production section
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this changes from the development file:
#   - Caddy is the only thing reachable from outside (ports 80 and 443). No database, broker, gateway or
#     web port is published on the host.
#   - Passwords and keys have no defaults: compose refuses to start until they are set in .env.
#   - Mailpit is replaced by your real mail server.
#   - The services restart always and log with rotation.
# Needs Docker Compose 2.24 or newer (for !reset).

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-prod-env: &prod-env
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  APP_URL: https://${HEARTH_DOMAIN:?Set HEARTH_DOMAIN in .env}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:?Set HEARTH_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [hearth]
    depends_on:
      web: { condition: service_healthy }
      gateway: { condition: service_healthy }
    <<: *logging

  postgres:
    restart: always
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    <<: *logging

  db-setup:
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

  kafka:
    restart: always
    ports: !reset []
    <<: *logging

  neo4j:
    restart: always
    ports: !reset []
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    <<: *logging

  redis:
    restart: always
    <<: *logging

  # No catch-all inbox in production.
  mailpit:
    profiles: [dev-only]

  family-service:
    restart: always
    environment:
      <<: *prod-env
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
    <<: *logging

  task-service:
    restart: always
    environment: { <<: *prod-env }
    <<: *logging

  decision-service:
    restart: always
    environment: { <<: *prod-env }
    <<: *logging

  care-service:
    restart: always
    environment:
      <<: *prod-env
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    <<: *logging

  notification-service:
    restart: always
    environment:
      <<: *prod-env
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Run node tools/vapid-keys.mjs and put the keys in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Run node tools/vapid-keys.mjs and put the keys in .env}
      VAPID_SUBJECT: mailto:${ACME_EMAIL:?Set ACME_EMAIL in .env}
    <<: *logging

  audit-service:
    restart: always
    environment: { <<: *prod-env }
    <<: *logging

  ai-service:
    restart: always
    environment: { <<: *prod-env }
    <<: *logging

  gateway:
    restart: always
    ports: !reset []
    environment:
      CORS_ALLOWED_ORIGINS: https://${HEARTH_DOMAIN:?Set HEARTH_DOMAIN in .env}
    <<: *logging

  web:
    restart: always
    ports: !reset []
    <<: *logging

volumes:
  caddy_data:
  caddy_config:
